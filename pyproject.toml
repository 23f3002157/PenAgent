[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "penagent-execution"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.111,<1", "pydantic>=2.7,<3", "httpx>=0.27,<1", "uvicorn>=0.30,<1", "jsonschema>=4.22,<5", "cryptography>=43", "networkx>=3.2", "pyyaml>=6", "redis>=5", "python-dotenv>=1,<2", "langchain-google-genai>=4.4,<5"]

[project.optional-dependencies]
test = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=6,<8"]

[tool.setuptools]
packages = ["penagent_common", "executor", "interpreter", "report", "sis", "sis.adapters", "hgs"]
package-dir = {executor = "c3-executor/executor", interpreter = "c4-interpreter/interpreter", report = "c6-report/report", sis = "c1-spec-ingestion/sis", hgs = "c2-hypothesis-gen/hgs"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
